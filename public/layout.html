<!doctype html>
<html lang="th" data-v="{{v}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8BBEF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14203F" media="(prefers-color-scheme: dark)">
<meta name="description" content="น้องฝนเฝ้าบ้าน — กล้องวงจรปิด + AI ช่วยเฝ้าระดับน้ำตอนกลางคืน จากจักรวาลน้องเก้า">
<title>{{title}} · น้องฝนเฝ้าบ้าน</title>
<link rel="icon" href="/static/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/static/img/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/static/fonts/mitr-thai-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/console.css">
<link rel="stylesheet" href="/static/css/pages.css">
<script src="/static/js/theme.js"></script>
</head>
<body data-page="{{page}}" data-demo="{{demo}}">
<a class="skip" href="#main">ข้ามไปเนื้อหา</a>
<header class="topbar">
  <a class="brand" href="/" aria-label="น้องฝนเฝ้าบ้าน หน้าหลัก">
    <span class="brand-face" data-mascot-face aria-hidden="true"></span>
    <span class="brand-text"><b>น้องฝน</b><small>เฝ้าบ้าน</small></span>
  </a>
  <span class="site-chip" data-site-name hidden></span>
  <nav class="nav" aria-label="เมนูหลัก">
    <a href="/" data-nav="overview"><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#i-home"/></svg><span>ภาพรวม</span></a>
    <a href="/cameras" data-nav="cameras"><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#i-cctv"/></svg><span>ดูกล้อง</span></a>
    <a href="/history" data-nav="history"><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#i-clock"/></svg><span>ย้อนหลัง</span></a>
    <a href="/lines" data-nav="lines"><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#i-lines"/></svg><span>ขีดเส้น</span></a>
    <a href="/settings" data-nav="settings"><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#i-gear"/></svg><span>ตั้งค่า</span></a>
  </nav>
  <div class="topbar-actions">
    <a class="icon-btn" href="/bedside" aria-label="โหมดข้างเตียง" title="โหมดข้างเตียง"><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#i-bed"/></svg></a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="สลับโหมดกลางวัน/กลางคืน" title="กลางวัน/กลางคืน">
      <svg class="i i-to-dark" aria-hidden="true"><use href="/static/img/icons.svg#i-moon"/></svg>
      <svg class="i i-to-light" aria-hidden="true"><use href="/static/img/icons.svg#i-sun"/></svg>
    </button>
    <a class="icon-btn" href="/logout" aria-label="ออกจากระบบ" title="ออกจากระบบ"><svg class="i" aria-hidden="true"><use href="/static/img/icons.svg#i-logout"/></svg></a>
  </div>
</header>
<p class="demo-ribbon" data-demo-ribbon hidden><b>โหมดสาธิต</b> · กล้องภาพวาด + AI จำลอง พายุจำลองมาทุก ~36 นาที กดเล่นได้ทุกปุ่มเลยค่ะ</p>
<main id="main" class="page page-{{page}}">
{{content}}
</main>
<footer class="foot">
  <span>☔ น้องฝนเฝ้าบ้าน</span><span aria-hidden="true">·</span><span>จากจักรวาลน้องเก้า</span><span aria-hidden="true">·</span><span>ขีดเส้นไว้ แล้วไปนอนเถอะ น้องฝนเฝ้าให้</span>
</footer>
<div class="toast-zone" aria-live="polite" aria-atomic="false"></div>
<script type="module" src="/static/js/pages/{{page}}.js"></script>
</body>
</html>
